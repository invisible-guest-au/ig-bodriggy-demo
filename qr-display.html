<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Experience - Bodriggy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7;
            --surface: #FFFFFF;
            --text: #1a1a2e;
            --muted: #6B6B7B;
            --primary: #5B5DAD;
            --secondary: #F5D547;
            --border: #E5E5EA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: var(--surface);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
            border-top: 4px solid var(--secondary);
        }

        .logo {
            margin-bottom: 2rem;
        }

        .logo img {
            height: 55px;
            width: auto;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .qr-container {
            background: linear-gradient(135deg, rgba(91, 93, 173, 0.08) 0%, rgba(245, 213, 71, 0.08) 100%);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .qr-code {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border-radius: 8px;
        }

        .instruction {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .instruction svg {
            width: 20px;
            height: 20px;
        }

        .tagline {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--muted);
        }

        .tagline span {
            color: var(--primary);
            font-weight: 600;
        }

        .powered-by {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .powered-by img {
            height: 16px;
            opacity: 0.6;
            vertical-align: middle;
            margin-left: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="./assets/Bodriggy.png" alt="Bodriggy">
        </div>
        
        <h1>Share Your Experience</h1>
        <p class="subtitle">We'd love to hear about your visit.<br>Your feedback helps us improve.</p>
        
        <div class="qr-container">
            <img 
                class="qr-code" 
                src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://invisible-guest-au.github.io/ig-bodriggy-demo/&bgcolor=FFFFFF&color=1a1a2e" 
                alt="Scan to leave feedback"
            >
        </div>
        
        <div class="instruction">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <rect x="7" y="7" width="3" height="3"></rect>
                <rect x="14" y="7" width="3" height="3"></rect>
                <rect x="7" y="14" width="3" height="3"></rect>
                <rect x="14" y="14" width="3" height="3"></rect>
            </svg>
            Scan with your phone camera
        </div>
        
        <p class="tagline">Takes less than <span>60 seconds</span></p>
        
        <div class="powered-by">
            Powered by <img src="./assets/Frank_Custom.png" alt="Frank">
        </div>
    </div>
</body>
</html>
